# Litestream configuration — continuously replicates the SQLite database to
# S3-compatible object storage so it survives redeploys on ephemeral hosts.
#
# IMPORTANT: the replica is configured as a URL, not as struct fields. That is
# deliberate. Litestream only applies Cloudflare R2's provider-specific defaults
# (concurrency=2, disabled request checksums, signed payloads) when a replica is
# built from a URL via NewReplicaClientFromURL(). The struct-field form skips
# them, which makes R2 reject ListObjectsV2 with a spurious "404 NoSuchKey"
# (litestream issue #1096 — the YAML-detection fix, PR #1098, was never merged).
#
# Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, which the
# Dockerfile entrypoint sets from Render's R2_* environment variables.
#
# The DB path must match $DATA_DIR/gamehub.db from the Dockerfile / resolveDbPath().
dbs:
  - path: /data/gamehub.db
    replicas:
      - url: "s3://${R2_BUCKET}/gamehub.db?endpoint=${R2_ENDPOINT}&region=auto"
